  - id: q-56a8826cbe
    query: "How did they determine fake news tweets?"
    relevant_papers:
      - "1712.05999"
    relevant_evidence:
      - "For our study, we used the number of retweets to single-out those that went viral within our sample. Tweets within that subset (viral tweets hereafter) are varied and relate to different topics. We consider that a tweet contains fake news if its text falls within any of the following categories described by Rubin et al. (see next section for the details of such categories): serious fabrication, large-scale hoaxes, jokes taken at face value, slanted reporting of real facts and stories where the truth is contentious. The dataset , manually labelled by an expert, has been publicly released and is available to researchers and interested parties."
      - "Previous works on the area (presented in the section above) suggest that there may be important determinants for the adoption and diffusion of fake news. Our hypotheses builds on them and identifies three important dimensions that may help distinguishing fake news from legit information:"
      - "Exposure."
      - "Characterization."
      - "Polarization."
    reference_answers:
      - "an expert annotator determined if the tweet fell under a specific category"
      - "Exposure Characterization Polarization"
    notes: "Gold answer: an expert annotator determined if the tweet fell under a specific category"

  - id: q-968b7c3553
    query: "What is their definition of tweets going viral?"
    relevant_papers:
      - "1712.05999"
    relevant_evidence:
      - "One straightforward way of sharing information on Twitter is by using the retweet functionality, which enables a user to share a exact copy of a tweet with his followers. Among the reasons for retweeting, Body et al. reported the will to: 1) spread tweets to a new audience, 2) to show one’s role as a listener, and 3) to agree with someone or validate the thoughts of others. As indicated, our initial interest is to characterize tweets containing fake news that went viral (as they are the most harmful ones, as they reach a wider audience), and understand how it differs from other viral tweets (that do not contain fake news). For our study, we consider that a tweet went viral if it was retweeted more than 1000 times."
      - "For our study, we used the number of retweets to single-out those that went viral within our sample. Tweets within that subset (viral tweets hereafter) are varied and relate to different topics. We consider that a tweet contains fake news if its text falls within any of the following categories described by Rubin et al. (see next section for the details of such categories): serious fabrication, large-scale hoaxes, jokes taken at face value, slanted reporting of real facts and stories where the truth is contentious. The dataset , manually labelled by an expert, has been publicly released and is available to researchers and interested parties."
    reference_answers:
      - "Viral tweets are the ones that are retweeted more than 1000 times"
      - "those that contain a high number of retweets"
    notes: "Gold answer: Viral tweets are the ones that are retweeted more than 1000 times"

  - id: q-f03df5d99b
    query: "What are the characteristics of the accounts that spread fake news?"
    relevant_papers:
      - "1712.05999"
    relevant_evidence:
      - "We found that 82 users within our sample were spreading fake news (i.e. they produced at least one tweet which was labelled as fake news). Out of those, 34 had verified accounts, and the rest were unverified. From the 48 unverified accounts, 6 have been suspended by Twitter at the date of writing, 3 tried to imitate legitimate accounts of others, and 4 accounts have been already deleted. Figure the figure shows the proportion of verified accounts to unverified accounts for viral tweets (containing fake news vs. not containing fake news). From the chart, it is clear that there is a higher chance of fake news coming from unverified accounts."
      - "A useful representation for friends and followers is the ratio between friends/followers. Figures the figure and the figure show this representation. Notice that accounts spreading viral tweets with fake news have, on average, a larger ratio of friends/followers. The distribution of those accounts not generating fake news is more evenly distributed."
      - "Figure the figure shows that, in contrast to other kinds of viral tweets, those containing fake news were created more recently. As such, Twitter users were exposed to fake news related to the election for a shorter period of time."
      - "Accounts spreading fake news appear to have a larger proportion of friends/followers (i.e. they have, on average, the same number of friends but a smaller number of followers) than those spreading viral content only. Together with the fact that, on average, tweets containing fake news have more URLs than those spreading viral content, it is possible to hypothesize that, both, the ratio of friends/followers of the account producing a viral tweet and number of URLs contained in such a tweet could be useful to single-out fake news in Twitter. Not only that, but our finding related to the number of URLs is in line with intuitions behind the incentives to create fake news commonly found in the literature (in particular that of obtaining revenue through click-through advertising)."
    reference_answers:
      - "Accounts that spread fake news are mostly unverified, recently created and have on average high friends/followers ratio"
      - "have a larger proportion of friends/followers (i.e. they have, on average, the same number of friends but a smaller number of followers) than those spreading viral content only"
    notes: "Gold answer: Accounts that spread fake news are mostly unverified, recently created and have on average high friends/followers ratio"

  - id: q-2ec97cf890
