  - id: q-5758ebff49
    query: "What do they constrain using integer linear programming?"
    relevant_papers:
      - "1807.09671"
    relevant_evidence:
      - "In this work, we propose to augment the integer linear programming (ILP)-based summarization framework with a low-rank approximation of the co-occurrence matrix, and further evaluate the approach on a broad range of datasets exhibiting high lexical diversity. The ILP framework, being extractive in nature, has demonstrated considerable success on a number of summarization tasks . It generates a summary by selecting a set of sentences from the source documents. The sentences shall maximize the coverage of important source content, while minimizing the redundancy among themselves. At the heart of the algorithm is a sentence-concept co-occurrence matrix, used to determine if a sentence contains important concepts and whether two sentences share the same concepts. We introduce a low-rank approximation to the co-occurrence matrix and optimize it using the proximal gradient method. The resulting system thus allows different sentences to share co-occurrence statistics. For example, “The activity with the bicycle parts\" will be allowed to partially contain “bike elements\" although the latter phrase does not appear in the sentence. The low-rank matrix approximation provides an effective way to implicitly group lexically-diverse but semantically-similar expressions. It can handle out-of-vocabulary expressions and domain-specific terminologies well, hence being a more principled approach than heuristically calculating similarities of word embeddings."
    reference_answers:
      - "low-rank approximation of the co-occurrence matrix"
    notes: "Gold answer: low-rank approximation of the co-occurrence matrix"

  - id: q-e84ba95c9a
    query: "Do they build one model per topic or on all topics?"
    relevant_papers:
      - "1807.09671"
    relevant_evidence:
      - "The turkers are asked to indicate their preference for system A or B based on the semantic resemblance to the human summary on a 5-Likert scale (`Strongly preferred A', `Slightly preferred A', `No preference', `Slightly preferred B', `Strongly preferred B'). They are rewarded $0.04 per task. We use two strategies to control the quality of the human evaluation. First, we require the turkers to have a HIT approval rate of 90% or above. Second, we insert some quality checkpoints by asking the turkers to compare two summaries of same text content but in different sentence orders. Turkers who did not pass these tests are filtered out. Due to budget constraints, we conduct pairwise comparisons for three systems. The total number of comparisons is 3 system-system pairs [formula] 5 turkers [formula] (36 tasks [formula] 1 human summaries for Eng + 44 [formula] 2 for Stat2015 + 48 [formula] 2 for Stat2016 + 46 [formula] 2 for CS2016 + 3 [formula] 8 for camera + 3 [formula] 5 for movie + 3 [formula] 2 for peer + 50 [formula] 4 for DUC04) = 8,355. The number of tasks for each corpus is shown in Table the table . To elaborate as an example, for Stat2015, there are 22 lectures and 2 prompts for each lecture. Therefore, there are 44 tasks (22 [formula] 2) in total. In addition, there are 2 human summaries for each task. We selected three competitive systems (SumBasic, ILP, and ILP+MC) and therefore we have 3 system-system pairs (ILP+MC vs. ILP, ILP+MC vs. SumBasic, and ILP vs. SumBasic) for each task and each human summary. Therefore, we have 44 [formula] 2 [formula] 3=264 HITs for Stat2015. Each HIT will be done by 5 different turkers, resulting in 264 [formula] 5=1,320 comparisons. In total, 306 unique turkers were recruited and on average 27.3 of HITs were completed by one turker. The distribution of the human preference scores is shown in Fig. the figure ."
    reference_answers:
      - "One model per topic."
    notes: "Gold answer: One model per topic."

  - id: q-caf9819be5
    query: "Do they quantitavely or qualitatively evalute the output of their low-rank approximation to verify the grouping of lexical items?"
    relevant_papers:
      - "1807.09671"
    relevant_evidence:
      - "In this section, we evaluate the proposed method intrinsically in terms of whether the co-occurrence matrix after the low-rank approximation is able to capture similar concepts on student response data sets, and also extrinsically in terms of the end task of summarization on all corpora. In the following experiments, summary length is set to be the average number of words in human summaries or less. For the matrix completion algorithm, we perform grid search (on a scale of [0, 5] with stepsize 0.5) to tune the hyper-parameter [formula] (Eq. EQREF10 ) with a leave-one-lecture-out (for student responses) or leave-one-task-out (for others) cross-validation."
      - "The results are shown in Table the table . [formula] significantly on all three courses. That is, a bigram does receive a higher partial score in a sentence that contains similar bigram(s) to it than a sentence that does not. Therefore, H1.a holds. For H1.b, we only observe [formula] significantly on Stat2016 and there is no significant difference between [formula] and [formula] on the other two courses. First, the gold-standard data set is still small in the sense that only a limited portion of bigrams in the entire data set are evaluated. Second, the assumption that phrases annotated by different colors are not necessarily unrelated is too strong. For example, “hypothesis testing\" and “H1 and Ho conditions\" are in different colors in the example of Table the table , but one is a subtopic of the other. An alternative way to evaluate the hypothesis is to let humans judge whether two bigrams are similar or not, which we leave for future work. Third, the gold standards are pairs of semantically similar bigrams, while matrix completion captures bigrams that occurs in a similar context, which is not necessarily equivalent to semantic similarity. For example, the sentence “graphs make it easier to understand concepts\" in Table the table is associated with “hard to\"."
