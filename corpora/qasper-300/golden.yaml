  - id: q-f52b2ca49d
    query: "How do they condition the output to a given target-source class?"
    relevant_papers:
      - "1910.10408"
    relevant_evidence:
      - "Methods ::: Length Token Method"
      - "Our first approach to control the length is inspired by target forcing in multilingual NMT. We first split the training sentence pairs into three groups according to the target/source length ratio (in terms of characters). Ideally, we want a group where the target is shorter than the source (short), one where they are equally-sized (normal) and a last group where the target is longer than the source (long). In practice, we select two thresholds $t_\\text{min}$ and $t_\\text{max}$ according to the length ratio distribution. All the sentence pairs with length ratio between $t_\\text{min}$ and $t_\\text{max}$ are in the normal group, the ones with ratio below $t_\\text{min}$ in short and the remaining in long. At training time we prepend a length token to each source sentence according to its group ($<$short$>$, $<$normal$>$, or $<$long$>$), in order to let a single network to discriminate between the groups (see Figure the figure). At inference time, the length token is used to bias the network to generate a translation that belongs to the desired length group."
    reference_answers:
      - "They use three groups short/normal/long translation classes to learn length token, which is in inference used to bias network to generate desired length group."
    notes: "Gold answer: They use three groups short/normal/long translation classes to learn length token, which is in inference used to bias network to generate desired length group."

