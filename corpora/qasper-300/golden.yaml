  - id: q-dc4096b8ba
    query: "How they observe that fine-tuning BERT on a specific task does not improve its prunability?"
    relevant_papers:
      - "2002.08307"
    relevant_evidence:
      - "Model compression, which attempts to shrink a model without losing accuracy, is a viable approach to decreasing GPU usage. It might also be used to trade accuracy for memory in some low-resource cases, such as deploying to smartphones for real-time prediction. The main questions this paper attempts to answer are: Does compressing BERT impede it's ability to transfer to new tasks? And does fine-tuning make BERT more or less compressible?"
      - "To explore these questions, we compressed English BERT using magnitude weight pruning and observed the results on transfer learning to the General Language Understanding Evaluation (GLUE) benchmark, a diverse set of natural language understanding tasks including sentiment analysis, NLI, and textual similarity evaluation. We chose magnitude weight pruning, which compresses models by removing weights close to 0, because it is one of the most fine-grained and effective compression methods and because there are many interesting ways to view pruning, which we explore in the next section."
      - "Our findings are as follows: Low levels of pruning (30-40%) do not increase pre-training loss or affect transfer to downstream tasks at all. Medium levels of pruning increase the pre-training loss and prevent useful pre-training information from being transferred to downstream tasks. This information is not equally useful to each task; tasks degrade linearly with pre-train loss, but at different rates. High levels of pruning, depending on the size of the downstream dataset, may additionally degrade performance by preventing models from fitting downstream datasets. Finally, we observe that fine-tuning BERT on a specific task does not improve its prunability or change the order of pruning by a meaningful amount."
    reference_answers:
      - "we compressed English BERT using magnitude weight pruning and observed the results on transfer learning to the General Language Understanding Evaluation (GLUE) benchmark, a diverse set of natural language understanding tasks including sentiment analysis, NLI, and textual similarity evaluation."
    notes: "Gold answer: we compressed English BERT using magnitude weight pruning and observed the results on transfer learning to the General Language Understanding Evaluation (GLUE) benchmark, a diverse set of natural language understanding tasks including sentiment analysis, NLI, and textual similarity evaluation."

