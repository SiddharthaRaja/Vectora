    notes: "Gold answer: political events such as elections, corruption cases or justice decisions"

  - id: q-a2a3af59f3
    query: "What social media platform is observed?"
    relevant_papers:
      - "2001.09899"
    relevant_evidence:
      - "Having this in mind and if we draw from the premise that when a discussion has a high controversy it is in general due to the presence of two principal communities fighting each other (or, conversely, that when there is no controversy there is just one principal community the members of which share a common point of view), we can measure the controversy by detecting if the discussion has one or two principal jargons in use. Our method is tested on Twitter datasets. This microblogging platform has been widely used to analyze discussions and polarization. It is a natural choice for these kind of problems, as it represents one of the main fora for public debate in online social media, it is a common destination for affiliative expressions and is often used to report and read news about current events. An extra advantage of Twitter for this kind of studies is the availability of real-time data generated by millions of users. Other social media platforms offer similar data-sharing services, but few can match the amount of data and the accompanied documentation provided by Twitter. One last asset of Twitter for our work is given by retweets, whom typically indicate endorsement and hence become a useful concept to model discussions as we can set “who is with who\". However, our method has a general approach and it could be used a priori in any social network. In this work we report excellent result tested on Twitter but in future work we are going to test it in other social networks."
    reference_answers:
      - "Twitter"
    notes: "Gold answer: Twitter"

