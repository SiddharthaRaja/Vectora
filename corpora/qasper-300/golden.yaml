  - id: q-91c8180737
    query: "What is barycentric Newton diagram?"
    relevant_papers:
      - "1705.03487"
    relevant_evidence:
      - "By using the probability values that emerge from the activation function in the neural network, rather than just the final classification, we can draw a barycentric Newton diagram, as shown in Figure 4 . The basic idea of the visualization, drawing on Isaac Newton’s visualization of the color spectrum , is to express a mixture in terms of its constituents as represented in barycentric coordinates. This visualization allows an intuitive interpretation of which country a recipe belongs to. If the probability of Japanese is high, the recipe is mapped near the Japanese. The countries on the Newton diagram are placed by spectral graph drawing , so that similar countries are placed nearby on the circle. The calculation is as follows. First we define the adjacency matrix $W$ as the similarity between two countries. The similarity between country $i$ and $j$ is calculated by cosine similarity of county $i$ vector and $j$ vector. These vector are defined in next section. $W_{ij} = sim(vec_i, vec_j)$ . The degree matrix $D$ is a diagonal matrix where $D_{ii} = \\sum _{j} W_{ij}$ . Next we calculate the eigendecomposition of $D^{-1}W$ . The second and third smallest eingenvalues and corresponded eingevectors are used for placing the countries. Eigenvectors are normalized so as to place the countries on the circle."
    reference_answers:
      - "The basic idea of the visualization, drawing on Isaac Newton’s visualization of the color spectrum , is to express a mixture in terms of its constituents as represented in barycentric coordinates."
    notes: "Gold answer: The basic idea of the visualization, drawing on Isaac Newton’s visualization of the color spectrum , is to express a mixture in terms of its constituents as represented in barycentric coordinates."

