<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vectora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #0e0e0e;
    --surface:   #161616;
    --surface2:  #1c1c1c;
    --border:    #252525;
    --border-hi: #333;
    --text:      #e8e4dc;
    --muted:     #555;
    --muted-hi:  #777;
    --accent:    #c8b99a;
    --accent-dim:#6b5f4e;
    --danger:    #b05c5c;
    --mono:      'DM Mono', monospace;
    --serif:     'DM Serif Display', serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 13px; font-weight: 300;
    line-height: 1.7; -webkit-font-smoothing: antialiased; }

  /* ── Layout ── */
  .shell { display: grid; grid-template-columns: 240px 1fr; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar { border-right: 1px solid var(--border); display: flex;
    flex-direction: column; height: 100vh; overflow: hidden; }

  .sidebar-top { padding: 28px 20px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .logo { font-family: var(--serif); font-size: 17px; color: var(--accent); }
  .logo span { display: block; font-family: var(--mono); font-size: 9px;
    color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 3px; }

  .new-chat-btn { margin-top: 16px; width: 100%; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text); font-family: var(--mono);
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 9px 14px; border-radius: 4px; cursor: pointer;
    transition: border-color .15s, color .15s; text-align: left; display: flex;
    align-items: center; gap: 8px; }
  .new-chat-btn:hover { border-color: var(--border-hi); color: var(--accent); }
  .new-chat-btn .plus { font-size: 16px; line-height: 1; color: var(--accent); }

  /* Sessions list */
  .sessions-label { padding: 16px 20px 8px; font-size: 9px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
  .sessions { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
  .sessions::-webkit-scrollbar { width: 3px; }
  .sessions::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

  .session-item { display: flex; align-items: center; gap: 6px; padding: 8px 12px;
    border-radius: 5px; cursor: pointer; transition: background .12s;
    border: 1px solid transparent; margin-bottom: 2px; }
  .session-item:hover { background: var(--surface2); }
  .session-item.active { background: var(--surface2); border-color: var(--border); }
  .session-title { flex: 1; font-size: 11px; color: var(--muted-hi); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; transition: color .12s; }
  .session-item.active .session-title,
  .session-item:hover .session-title { color: var(--text); }
  .session-del { opacity: 0; font-size: 14px; color: var(--muted); background: none;
    border: none; cursor: pointer; padding: 0 2px; line-height: 1;
    transition: opacity .12s, color .12s; flex-shrink: 0; }
  .session-item:hover .session-del { opacity: 1; }
  .session-del:hover { color: var(--danger); }

  /* Sidebar bottom */
  .sidebar-bottom { padding: 14px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .status-row { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background .3s; }
  .dot.ok { background: #5a8a5a; }  .dot.err { background: var(--danger); }

  /* Settings toggle */
  .settings-toggle { width: 100%; background: none; border: none; color: var(--muted);
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 8px 0 0; cursor: pointer; text-align: left; transition: color .15s; }
  .settings-toggle:hover { color: var(--text); }
  .settings-panel { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
  .settings-panel.hidden { display: none; }
  .settings-panel input, .settings-panel select {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: 11px; font-weight: 300; padding: 6px 9px;
    border-radius: 3px; width: 100%; outline: none; transition: border-color .15s; }
  .settings-panel input:focus, .settings-panel select:focus { border-color: var(--accent-dim); }
  .settings-panel input::placeholder { color: var(--muted); }
  select option { background: var(--surface); }

  /* ── Main ── */
  .main { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  .header { border-bottom: 1px solid var(--border); padding: 18px 36px;
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .header-title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 400px; }

  /* ── Messages ── */
  .messages { flex: 1; overflow-y: auto; padding: 36px 40px;
    display: flex; flex-direction: column; gap: 36px; scroll-behavior: smooth; }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

  .empty-state { margin: auto; text-align: center; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    animation: fade-in .5s ease both; }
  .empty-icon { font-family: var(--serif); font-style: italic; font-size: 44px;
    color: var(--border-hi); line-height: 1; }
  .empty-hint { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }

  .msg { display: flex; flex-direction: column; gap: 5px;
    animation: slide-up .22s ease both; max-width: 720px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .msg-role { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .msg-bubble { padding: 14px 18px; border-radius: 6px; line-height: 1.75; font-size: 13px; }
  .msg.user .msg-bubble { background: var(--surface); border: 1px solid var(--border); color: var(--accent); }
  .msg.assistant .msg-bubble { border: 1px solid var(--border); color: var(--text); max-width: 660px; }
  .msg.assistant .msg-bubble p { margin-bottom: 9px; }
  .msg.assistant .msg-bubble p:last-child { margin-bottom: 0; }

  .citations { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 5px; }
  .cite-label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 3px; }
  .cite-item { font-size: 11px; color: var(--muted); line-height: 1.5; padding-left: 10px;
    border-left: 2px solid var(--accent-dim); transition: border-color .15s, color .15s; }
  .cite-item:hover { border-color: var(--accent); color: var(--text); }
  .cite-title { color: var(--accent); }
  .cite-doi { font-size: 10px; color: var(--accent-dim); text-decoration: none; }
  .cite-doi:hover { color: var(--accent); text-decoration: underline; }

  .thinking { display: flex; align-items: center; gap: 10px; color: var(--muted);
    font-size: 11px; letter-spacing: 0.06em; padding: 10px 0; animation: fade-in .3s ease both; }
  .dots { display: flex; gap: 4px; }
  .dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--muted);
    animation: pulse 1.2s ease-in-out infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }

  .msg-error { font-size: 12px; color: var(--danger); border: 1px solid #3a1f1f;
    background: #1a0f0f; padding: 11px 15px; border-radius: 5px; }

  /* ── Input ── */
  .input-area { border-top: 1px solid var(--border); padding: 20px 40px; flex-shrink: 0; }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: var(--mono); font-size: 13px; font-weight: 300;
    line-height: 1.6; padding: 11px 15px; border-radius: 5px; resize: none; outline: none;
    min-height: 46px; max-height: 150px; overflow-y: auto; transition: border-color .15s; }
  textarea:focus { border-color: var(--accent-dim); }
  textarea::placeholder { color: var(--muted); }
  .send-btn { flex-shrink: 0; background: var(--accent); color: var(--bg); border: none;
    font-family: var(--mono); font-size: 11px; font-weight: 400; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 0 18px; border-radius: 5px; cursor: pointer;
    height: 46px; transition: opacity .15s, transform .1s; white-space: nowrap; }
  .send-btn:hover:not(:disabled) { opacity: .85; }
  .send-btn:active:not(:disabled) { transform: scale(.97); }
  .send-btn:disabled { opacity: .3; cursor: not-allowed; }
  .input-hint { margin-top: 7px; font-size: 10px; color: var(--muted); }

  /* ── No session state ── */
  .no-session { margin: auto; text-align: center; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .no-session-icon { font-family: var(--serif); font-style: italic;
    font-size: 44px; color: var(--border-hi); }
  .start-btn { background: var(--surface2); border: 1px solid var(--border);
    color: var(--accent); font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase; padding: 10px 20px;
    border-radius: 4px; cursor: pointer; transition: border-color .15s; margin-top: 4px; }
  .start-btn:hover { border-color: var(--accent-dim); }


  /* ── Mode toggle ── */
  .mode-toggle { display: flex; align-items: center; gap: 4px; }
  .mode-btn { background: none; border: 1px solid var(--border); color: var(--muted);
    font-family: var(--mono); font-size: 10px; padding: 3px 10px; border-radius: 3px;
    cursor: pointer; transition: all .15s; white-space: nowrap; }
  .mode-btn:hover { border-color: var(--border-hi); color: var(--text); }
  .mode-btn.active.fast     { border-color: #2a4a2a; color: #5a8a5a; background: rgba(90,138,90,0.07); }
  .mode-btn.active.balanced { border-color: var(--accent-dim); color: var(--accent); background: rgba(200,185,154,0.07); }
  .mode-btn.active.deep     { border-color: #2a2a4a; color: #7a7aaa; background: rgba(122,122,170,0.07); }



  /* ── Export button ── */
  .export-btn { background: none; border: 1px solid var(--border); color: var(--muted);
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 4px 12px; border-radius: 3px; cursor: pointer; transition: all .15s;
    white-space: nowrap; }
  .export-btn:hover { border-color: var(--accent-dim); color: var(--accent); }
  .export-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ── Query type pill ── */
  .qtype-pill { display: inline-block; font-size: 9px; letter-spacing: 0.12em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 2px;
    border: 1px solid var(--border); color: var(--muted); margin-bottom: 8px; }
  .qtype-pill.factual        { color: #5a8aaa; border-color: #1a3a4a; }
  .qtype-pill.comparative    { color: #8a7aaa; border-color: #2a1a4a; }
  .qtype-pill.methodological { color: #7a8a5a; border-color: #2a3a1a; }
  .qtype-pill.definitional   { color: #aa8a5a; border-color: #4a3a1a; }
  .qtype-pill.exploratory    { color: #8aaa7a; border-color: #2a4a1a; }
  .qtype-pill.causal         { color: #aa7a7a; border-color: #4a1a1a; }

  /* ── Faithfulness badge ── */
  .faith-badge { display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; letter-spacing: 0.08em; padding: 4px 10px;
    border-radius: 3px; margin-bottom: 10px; border: 1px solid; }
  .faith-badge.faithful         { color: #5a8a5a; border-color: #2a4a2a; background: #0d1f0d; }
  .faith-badge.mostly-faithful  { color: #8a7a3a; border-color: #4a3a10; background: #1a160a; }
  .faith-badge.partially        { color: #8a5a2a; border-color: #4a2a10; background: #1a100a; }
  .faith-badge.unfaithful       { color: var(--danger); border-color: #3a1f1f; background: #1a0f0f; }
  .faith-badge .faith-score     { font-weight: 400; }
  .faith-detail { margin-top: 8px; padding: 10px 12px; border-radius: 4px;
    border: 1px solid #252525; background: #111; font-size: 11px;
    color: var(--muted); display: none; cursor: default; }
  .faith-detail.open { display: block; }
  .faith-detail .unsupported-label { color: #b05c5c; font-size: 9px;
    letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 5px; }
  .faith-detail .claim { padding: 3px 0; border-bottom: 1px solid #1c1c1c; }
  .faith-detail .claim:last-child { border-bottom: none; }
  .faith-toggle { background: none; border: none; color: var(--muted);
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
    text-transform: uppercase; cursor: pointer; padding: 0; margin-left: 4px;
    transition: color .15s; }
  .faith-toggle:hover { color: var(--text); }


  /* ── Fallback card ── */
  .fallback-card { border: 1px solid #3a2a1a; background: #150f0a;
    border-radius: 6px; padding: 16px 18px; font-size: 12px; color: var(--muted); }
  .fallback-title { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #8a5a2a; margin-bottom: 8px; }
  .fallback-msg { color: #aa8a6a; line-height: 1.6; margin-bottom: 12px; }
  .fallback-section-label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 5px; margin-top: 10px; }
  .fallback-item { padding: 4px 0 4px 10px; border-left: 2px solid #3a2a1a;
    font-size: 11px; color: #7a6a5a; cursor: pointer; transition: color .15s, border-color .15s; }
  .fallback-item:hover { color: var(--accent); border-color: var(--accent-dim); }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slide-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,80%,100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
<div class="shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo">Vectora <span>Research Assistant</span></div>
      <button class="new-chat-btn" onclick="newChat()">
        <span class="plus">+</span> New chat
      </button>
    </div>

    <div class="sessions-label">Recent</div>
    <div class="sessions" id="sessions-list"></div>

    <div class="sidebar-bottom">
      <div class="status-row">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">Connecting...</span>
      </div>
      <button class="settings-toggle" onclick="toggleSettings()">⚙ Settings</button>
      <div class="settings-panel hidden" id="settings-panel">
        <input type="text" id="filter-year" placeholder="Filter by year">
        <input type="text" id="filter-paper" placeholder="Filter by paper ID">
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="header">
      <div class="header-title" id="header-title">Select or start a chat</div>
      <button class="export-btn" id="export-btn" onclick="exportPDF()" disabled title="Export conversation as PDF">↓ PDF</button>
    </header>

    <div class="messages" id="messages">
      <div class="no-session" id="no-session">
        <div class="no-session-icon">∴</div>
        <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase">No chat selected</div>
        <button class="start-btn" onclick="newChat()">+ Start new chat</button>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea id="query-input" placeholder="Ask a question about the research..."
          rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)" disabled></textarea>
        <button class="send-btn" id="send-btn" onclick="sendQuery()" disabled>Send</button>
      </div>
      <div class="input-footer">
        <span class="input-hint">Enter · Shift+Enter new line</span>
        <div style="display:flex;align-items:center;gap:12px">
          <div class="mode-toggle">
            <button class="mode-btn fast"     data-mode="fast"     onclick="setMode(this)" title="~3-4s · no HyDE, no reranker">Fast</button>
            <button class="mode-btn balanced active" data-mode="balanced" onclick="setMode(this)" title="~6-8s · HyDE + reranker">Balanced</button>
            <button class="mode-btn deep"     data-mode="deep"     onclick="setMode(this)" title="~10-14s · full pipeline + faithfulness">Deep</button>
          </div></div>
      </div>
    </div>
  </main>
</div>

<script>
  // ── State ──
  let currentSessionId = null;

  const messagesEl  = document.getElementById('messages');
  const inputEl     = document.getElementById('query-input');
  const sendBtn     = document.getElementById('send-btn');
  const headerTitle = document.getElementById('header-title');
  const statusDot   = document.getElementById('status-dot');
  const statusText  = document.getElementById('status-text');

  // ── Mode toggle ──
  function setMode(btn) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  function getMode() {
    const active = document.querySelector('.mode-btn.active');
    return active ? active.dataset.mode : 'balanced';
  }


  // ── Export ──
  async function exportPDF() {
    if (!currentSessionId) return;
    const btn = document.getElementById('export-btn');
    const orig = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Exporting...';
    try {
      const res = await fetch(`/sessions/${currentSessionId}/export/pdf`);
      if (!res.ok) {
        const err = await res.json();
        alert('Export failed: ' + (err.error || 'Unknown error'));
        return;
      }
      // Trigger browser download
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = res.headers.get('Content-Disposition')
        ?.match(/filename="([^"]+)"/)?.[1] || 'vectora_export.pdf';
      a.click();
      URL.revokeObjectURL(url);
    } catch (e) {
      alert('Export failed: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = orig;
    }
  }

  // ── Init ──
  async function init() {
    await checkHealth();
    await loadSessions();
  }

  async function checkHealth() {
    try {
      const r = await fetch('/health');
      if (r.ok) { statusDot.className = 'dot ok'; statusText.textContent = 'Connected'; }
      else throw new Error();
    } catch { statusDot.className = 'dot err'; statusText.textContent = 'Offline'; }
  }

  // ── Sessions ──
  async function loadSessions() {
    const res  = await fetch('/sessions');
    const list = await res.json();
    renderSessions(list);
  }

  function renderSessions(list) {
    const el = document.getElementById('sessions-list');
    el.innerHTML = '';
    if (!list.length) {
      el.innerHTML = '<div style="padding:8px 12px;font-size:10px;color:var(--muted)">No chats yet</div>';
      return;
    }
    list.forEach(s => {
      const item = document.createElement('div');
      item.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
      item.dataset.id = s.id;
      item.innerHTML = `
        <div class="session-title" title="${esc(s.title)}">${esc(s.title)}</div>
        <button class="session-del" onclick="deleteSession(event,'${s.id}')" title="Delete">×</button>`;
      item.addEventListener('click', () => loadSession(s.id, s.title));
      el.appendChild(item);
    });
  }

  async function newChat() {
    const res     = await fetch('/sessions', { method: 'POST' });
    const session = await res.json();
    await loadSessions();
    await loadSession(session.id, session.title);
    inputEl.focus();
  }

  async function loadSession(sid, title) {
    currentSessionId = sid;
    headerTitle.textContent = title;

    // Mark active in sidebar
    document.querySelectorAll('.session-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === sid);
    });

    // Enable input and export
    inputEl.disabled = false;
    sendBtn.disabled = false;
    document.getElementById('export-btn').disabled = false;

    // Load messages
    const res  = await fetch(`/sessions/${sid}/messages`);
    const msgs = await res.json();

    messagesEl.innerHTML = '';
    if (!msgs.length) {
      messagesEl.innerHTML = `
        <div class="empty-state" style="margin:auto;text-align:center;color:var(--muted);
          display:flex;flex-direction:column;align-items:center;gap:12px">
          <div class="empty-icon">∴</div>
          <div class="empty-hint">Ask anything about your papers</div>
        </div>`;
    } else {
      msgs.forEach(m => renderMessage(m.role, m.content, m.citations || [], null, null, null));
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
    inputEl.focus();
  }

  async function deleteSession(e, sid) {
    e.stopPropagation();
    await fetch(`/sessions/${sid}`, { method: 'DELETE' });
    if (currentSessionId === sid) {
      currentSessionId = null;
      headerTitle.textContent = 'Select or start a chat';
      inputEl.disabled = true;
      sendBtn.disabled = true;
      messagesEl.innerHTML = `
        <div class="no-session" id="no-session">
          <div class="no-session-icon">∴</div>
          <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase">No chat selected</div>
          <button class="start-btn" onclick="newChat()">+ Start new chat</button>
        </div>`;
    }
    await loadSessions();
  }

  // ── Render helpers ──
  function renderMessage(role, content, citations, faithfulness, queryType, fallback) {
    // Remove empty state if present
    const empty = messagesEl.querySelector('.empty-state, .no-session');
    if (empty) empty.remove();

    const msg    = document.createElement('div');
    msg.className = `msg ${role}`;

    const roleEl = document.createElement('div');
    roleEl.className = 'msg-role';
    roleEl.textContent = role === 'user' ? 'You' : 'Assistant';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    if (role === 'user') {
      bubble.textContent = content;
    } else {
      bubble.innerHTML = content.split('\n\n').filter(p => p.trim())
        .map(p => `<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('');

      // Fallback card — check for fallback object (triggered flag or just presence)
      const isFallback = fallback && (fallback.triggered === true || fallback.reason);
      if (isFallback) {
        bubble.innerHTML = '';  // wipe any text set above
        const fc = document.createElement('div');
        fc.className = 'fallback-card';
        const isNoResult = fallback.reason === 'no_results';
        const icon  = isNoResult ? '⊘' : '⚠';
        const title = isNoResult ? 'Nothing found' : 'Low confidence';
        let html = `<div class="fallback-title">${icon} ${title}</div>`;
        html += `<div class="fallback-msg">${esc(fallback.message || 'No relevant content found. Try rephrasing your question.')}</div>`;
        const sugs = fallback.suggestions || [];
        if (sugs.length) {
          html += `<div class="fallback-section-label">Try rephrasing</div>`;
          sugs.forEach(s => {
            html += `<div class="fallback-item" onclick="useSuggestion(${JSON.stringify(s)})">${esc(s)}</div>`;
          });
        }
        const topics = fallback.related_topics || [];
        if (topics.length) {
          html += `<div class="fallback-section-label">Related content in your papers</div>`;
          topics.forEach(t => {
            html += `<div class="fallback-item">${esc(t)}</div>`;
          });
        }
        fc.innerHTML = html;
        bubble.appendChild(fc);
        msg.appendChild(roleEl);
        msg.appendChild(bubble);
        messagesEl.appendChild(msg);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return;  // skip citations/badge rendering
      }

      // Query type pill
      if (queryType && queryType !== 'unknown') {
        const pill = document.createElement('div');
        pill.className = `qtype-pill ${queryType}`;
        pill.textContent = queryType;
        bubble.insertBefore(pill, bubble.firstChild);
      }

      // Faithfulness badge
      if (faithfulness) {
        const verdictClass = {
          'FAITHFUL':           'faithful',
          'MOSTLY_FAITHFUL':    'mostly-faithful',
          'PARTIALLY_FAITHFUL': 'partially',
          'UNFAITHFUL':         'unfaithful',
        }[faithfulness.verdict] || 'partially';

        const icons = {
          'faithful': '✓', 'mostly-faithful': '~',
          'partially': '!', 'unfaithful': '✗'
        };

        const badgeId   = 'faith-' + Math.random().toString(36).slice(2);
        const detailId  = 'faith-d-' + Math.random().toString(36).slice(2);
        const hasDetail = faithfulness.unsupported_claims && faithfulness.unsupported_claims.length > 0;

        const badgeHtml = `
          <div class="faith-badge ${verdictClass}">
            <span>${icons[verdictClass]} ${faithfulness.score}% faithful</span>
            <span class="faith-score">— ${esc(faithfulness.summary)}</span>
            ${hasDetail ? `<button class="faith-toggle" onclick="toggleFaith('${detailId}')">details</button>` : ''}
          </div>
          ${hasDetail ? `
          <div class="faith-detail" id="${detailId}">
            <div class="unsupported-label">Unsupported claims</div>
            ${faithfulness.unsupported_claims.map(c => `<div class="claim">✗ ${esc(c)}</div>`).join('')}
          </div>` : ''}`;

        const faithEl = document.createElement('div');
        faithEl.innerHTML = badgeHtml;
        bubble.insertBefore(faithEl, bubble.firstChild);
      }

      if (citations && citations.length) {
        const cb = document.createElement('div');
        cb.className = 'citations';
        cb.innerHTML = `<div class="cite-label">References</div>`;
        citations.forEach(c => {
          const author = c.authors ? c.authors.split(',')[0].trim() : 'Unknown';
          const year   = c.year || 'n.d.';
          const doi    = c.doi
            ? `<a class="cite-doi" href="https://doi.org/${c.doi}" target="_blank"> · ${c.doi}</a>`
            : '';
          cb.innerHTML += `<div class="cite-item">
            <span class="cite-title">${esc(c.title||'Untitled')}</span>
            · ${esc(author)} et al. (${year}) · ${esc(c.section||'')} p.${c.page||'?'}${doi}
          </div>`;
        });
        bubble.appendChild(cb);
      }
    }

    msg.appendChild(roleEl);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendThinking() {
    const el = document.createElement('div');
    el.className = 'thinking'; el.id = 'thinking';
    el.innerHTML = `<div class="dots"><span></span><span></span><span></span></div><span>Retrieving & generating</span>`;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function removeThinking() { document.getElementById('thinking')?.remove(); }

  // ── Send ──
  async function sendQuery() {
    if (!currentSessionId) return;
    const query = inputEl.value.trim();
    if (!query) return;

    inputEl.value = ''; inputEl.style.height = 'auto';
    sendBtn.disabled = true; inputEl.disabled = true;

    renderMessage('user', query, []);
    appendThinking();

    try {
      const payload = {
        query,
        mode:     getMode(),
        year:     document.getElementById('filter-year').value.trim() || null,
        paper_id: document.getElementById('filter-paper').value.trim() || null,
      };
      const res  = await fetch(`/sessions/${currentSessionId}/chat`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      removeThinking();

      if (data.error) {
        const errEl = document.createElement('div');
        errEl.className = 'msg assistant';
        errEl.innerHTML = `<div class="msg-role">Assistant</div><div class="msg-error">${esc(data.error)}</div>`;
        messagesEl.appendChild(errEl);
      } else {
        renderMessage('assistant', data.answer, data.citations || [], data.faithfulness || null, data.query_type || null, data.fallback || null);
        // Update session title in sidebar
        await loadSessions();
        // Re-mark active
        document.querySelectorAll('.session-item').forEach(el => {
          el.classList.toggle('active', el.dataset.id === currentSessionId);
        });
      }
    } catch {
      removeThinking();
      const errEl = document.createElement('div');
      errEl.className = 'msg assistant';
      errEl.innerHTML = `<div class="msg-role">Assistant</div><div class="msg-error">Could not reach the server.</div>`;
      messagesEl.appendChild(errEl);
    } finally {
      sendBtn.disabled = false; inputEl.disabled = false; inputEl.focus();
    }
  }

  // ── Helpers ──
  function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuery(); } }
  function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 150) + 'px'; }
  function toggleSettings() { document.getElementById('settings-panel').classList.toggle('hidden'); }
  function useSuggestion(text) {
    if (!currentSessionId) return;
    inputEl.value = text;
    autoResize(inputEl);
    inputEl.focus();
  }

  function toggleFaith(id) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('open');
  }

  function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
