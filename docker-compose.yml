# Local stack: Qdrant plus the app.
#
#   docker compose up -d qdrant        # just the vector store
#   docker compose up --build          # everything
#
# The model cache is a named volume, so the ~500MB of sentence-transformers
# weights survive a rebuild instead of being downloaded again.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__LOG_LEVEL: "WARN"
    healthcheck:
      # The image has no curl or wget, so probe from Python instead.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  vectora:
    build: .
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in your .env}
      VECTORA_QDRANT_URL: http://qdrant:6333
      VECTORA_HOST: 0.0.0.0
      VECTORA_PORT: "5000"
      VECTORA_ENV: prod
      VECTORA_LOG_FORMAT: json
      VECTORA_CORS_ORIGINS: http://localhost:5000
    volumes:
      - ./chunks.jsonl:/app/chunks.jsonl:ro
      - vectora_data:/app/data
      - model_cache:/home/vectora/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  qdrant_data:
  vectora_data:
  model_cache:
